<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理面板 · TM PromptForge</title>
<link rel="icon" href="data/images/logo.svg">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<!-- 登录 -->
<section id="admin-login" class="admin-login">
  <div class="admin-login-card">
    <img class="admin-login-logo" src="data/images/logo.svg" alt="TM PromptForge">
    <h1 class="admin-login-title">管理面板</h1>
    <p class="admin-login-sub">TM PromptForge · 条目与图片管理</p>
    <label class="field">
      <span class="field-label">管理员口令</span>
      <input id="admin-pw" type="password" placeholder="请输入口令" autocomplete="current-password">
    </label>
    <button id="admin-login-btn" type="button" class="btn-primary-block">登录</button>
    <p id="admin-login-msg" class="admin-msg"></p>
  </div>
</section>

<!-- 面板主体 -->
<section id="admin-app" class="admin-app is-hidden">
  <header class="admin-top">
    <div class="admin-top-inner">
      <div class="admin-top-brand">
        <img src="data/images/logo.svg" alt="">
        <span>TM PromptForge<em>管理面板</em></span>
      </div>
      <div class="admin-top-actions">
        <span id="admin-status" class="admin-status"></span>
        <a class="btn-ghost" href="/index.html" target="_blank">查看游客页</a>
        <button id="admin-logout" type="button" class="btn-ghost">退出</button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <!-- 左：条目列表 -->
    <aside class="admin-side">
      <div class="admin-side-head">
        <button id="admin-new" type="button" class="btn-primary-block">＋ 新增条目</button>
        <input id="admin-search" type="search" placeholder="搜索标题或提示词…">
        <div id="admin-cats" class="admin-cats"></div>
      </div>
      <ul id="admin-entry-list" class="admin-entry-list"></ul>
      <!-- 书4：分类管理（增 / 删 / 改名级联）。放在侧栏底部，不挤表单的一屏空间 -->
      <div id="cat-manager" class="cat-manager">
        <div class="cat-manager-head">分类管理</div>
        <div class="cat-add-row">
          <input id="cat-new" type="text" placeholder="新分类名称" autocomplete="off">
          <button id="cat-add" type="button" class="btn-mini">添加</button>
        </div>
        <div id="cat-rows" class="cat-rows"></div>
        <p id="cat-msg" class="admin-msg"></p>
      </div>
    </aside>

    <!-- 右：编辑表单 -->
    <main class="admin-main">
      <form id="admin-form" class="admin-form is-hidden" autocomplete="off">
        <h2 id="admin-form-title" class="admin-form-title">新增条目</h2>

        <div class="grid-2">
          <label class="field"><span class="field-label">标题 *</span>
            <input id="f-title" type="text" required></label>
          <label class="field"><span class="field-label">分类 *</span>
            <select id="f-category" required></select></label>
        </div>

        <label class="field"><span class="field-label">正向提示词 *</span>
          <textarea id="f-prompt" rows="6" required></textarea></label>

        <label class="field"><span class="field-label">负向提示词（可空）</span>
          <textarea id="f-negative" rows="3"></textarea></label>

        <div class="grid-2">
          <label class="field"><span class="field-label">适用模型</span>
            <input id="f-model" type="text" list="f-model-list" autocomplete="off">
            <datalist id="f-model-list"></datalist></label>
          <label class="field"><span class="field-label">贡献人</span>
            <input id="f-author" type="text"></label>
        </div>

        <label class="field"><span class="field-label">来源</span>
          <input id="f-source" type="text"></label>

        <label class="field"><span class="field-label">标签（逗号分隔）</span>
          <input id="f-tags" type="text" placeholder="冷白, 瑞士风"></label>

        <!-- 图片 -->
        <div class="field">
          <span class="field-label">效果图（1~3 张，首张为封面）</span>
          <div id="admin-img-list" class="admin-img-list"></div>
          <input id="admin-file" type="file" accept="image/*" multiple>
          <p class="field-hint">上传自动压缩：长边 ≤1600px、体积 ≤300KB；压不进自动降质量重压。</p>
          <p id="admin-img-msg" class="admin-msg"></p>
        </div>

        <div class="admin-form-actions">
          <button id="admin-save" type="submit" class="btn-primary-block">保存</button>
          <button id="admin-cancel" type="button" class="btn-ghost">取消</button>
          <button id="admin-delete" type="button" class="btn-danger is-hidden">删除此条</button>
        </div>
      </form>
      <div id="admin-empty" class="admin-empty">选择左侧条目进行编辑，或点「新增条目」。</div>
    </main>
  </div>
</section>

<script src="admin.js"></script>
</body>
</html>
